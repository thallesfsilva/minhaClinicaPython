{% extends 'core/base.html' %}

{% block title %}Editar Status{% endblock %}

{% block content %}
<h2>Editar Status do Agendamento</h2>

<form method="post" class="card p-4">
    {% csrf_token %}
    <p><strong>Paciente:</strong> {{ agendamento.paciente }}</p>
    <p><strong>Procedimento:</strong> {{ agendamento.procedimento }}</p>
    <p><strong>Data:</strong> {{ agendamento.data_agendamento }}</p>

    <label for="status_agendamento">Status:</label>
    <select name="status_agendamento" id="status_agendamento" class="form-select">
        {% for key, value in agendamento.STATUS_CHOICES %}
            <option value="{{ key }}" {% if agendamento.get_status_agendamento_display == key %}selected{% endif %}>{{ value }}</option>
        {% endfor %}
    </select>

    <button type="submit" class="btn btn-primary mt-3">Salvar</button>
    <a href="{% url 'listar_agendamentos' %}" class="btn btn-secondary mt-3">Cancelar</a>
</form>
{% endblock %}
