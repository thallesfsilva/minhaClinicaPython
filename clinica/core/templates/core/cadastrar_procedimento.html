{% extends 'core/base.html' %}

{% block content %}
<h2 class="mb-4">Cadastrar Procedimento</h2>
<form method="post" class="card p-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mt-2">Salvar</button>
</form>
<a href="{% url 'listar_procedimentos' %}" class="btn btn-link mt-2">Voltar</a>
{% endblock %}
